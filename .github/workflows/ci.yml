name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript, tests, nitrogen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test src plugin
      - run: bun run build
      - run: bun run specs
      - name: nitrogen output must be committed
        run: git diff --exit-code -- nitrogen
