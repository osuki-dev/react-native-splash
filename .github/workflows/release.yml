name: Release

# Same flow as osuki-dev/react-native-ssh: a push to main is not a release.
# With changesets pending, the cheap `version` job opens/updates the
# "Version Packages" PR. Once that PR is merged (no changesets left,
# package.json carries the new version), the `publish` job builds and
# publishes to npm with trusted publishing. Any other push to main (docs,
# CI tweaks, a version already on npm) ends after the cheap job.
#
# The very first version is published by hand so the npm package exists
# before trusted publishing is configured for it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version PR or decide to publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the version bump
      pull-requests: write # open the "Version Packages" PR
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bun install --frozen-lockfile

      - name: Open or update the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          # No `publish` here: publishing happens in the job below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this push is a release
        id: decide
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.changesets.outputs.hasChangesets }}" = "true" ]; then
            echo "changesets pending → version PR only"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$VERSION" = "0.0.0" ]; then
            echo "placeholder version → nothing to publish"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if npm view "@osuki-dev/react-native-splash@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already on npm"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "publishing $VERSION"; echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the release tag
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Deliberately no `registry-url`: an empty authToken in .npmrc would beat OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify before releasing
        run: |
          bun run typecheck
          bun test src plugin
          bun run specs
          git diff --exit-code -- nitrogen

      - name: Publish ${{ needs.version.outputs.version }}
        # Explicit npm publish (not `changeset publish`) so npm's own output —
        # registry, tarball contents, provenance — is visible in the log.
        # `prepack` builds lib/, plugin/build and cli/build.
        run: |
          npm --version
          echo "registry: $(npm config get registry)"
          npm publish --dry-run --access public 2>&1 | tail -40
          npm publish --provenance --access public
          echo "published: $(npm view "@osuki-dev/react-native-splash@${{ needs.version.outputs.version }}" version)"

      - name: Push the release tag
        run: |
          git tag "v${{ needs.version.outputs.version }}" 2>/dev/null || true
          git push origin "v${{ needs.version.outputs.version }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash scripts/release-notes.sh "$VERSION" > /tmp/notes.md
          printf '\n\nnpm: https://www.npmjs.com/package/@osuki-dev/react-native-splash/v/%s\n' "$VERSION" >> /tmp/notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file /tmp/notes.md --verify-tag
